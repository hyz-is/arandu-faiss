# What this package declares about itself.
#
# The declaration is capability, not intent, and `aru doctor` compares it with
# what the code imports and calls. A package that says it makes no outbound
# calls and then holds an HTTP client is rejected, which is what makes the
# four lines below worth reading before installing anything.

name = "hyz-is/faiss"
framework = ">= 0.56"
profiles = ["conventional", "performance"]

[permissions]
# It answers no request and opens no connection. Nothing leaves the process.
network = false
# It reads and writes no file. An index is serialized to bytes in memory and
# handed to the Store the application passes in, which decides where they go
# (sealed, in object storage); the package never names a path.
filesystem = false
# It runs no other program. It does link one: FAISS, through its C API
# (libfaiss_c), with cgo. That is not exec and the manifest has no key for it,
# so it is said here instead -- an application registering this module builds
# with CGO_ENABLED=1 and needs the FAISS shared libraries on the machine it
# runs on. Built without cgo, every call reports the engine unavailable.
exec = false
# It owns no table.
migrations = false
